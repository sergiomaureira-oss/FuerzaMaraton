<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Rutina de fuerza — Maratón Valencia</title>
<style>
  :root{
    --bg: #0F1512;
    --panel: #161F1A;
    --panel2: #1C2620;
    --line: #2A3A32;
    --ink: #ECEFE9;
    --ink-dim: #9AA69D;
    --ink-mute: #6E7A73;
    --accent: #5B8C7B;
    --success: #4A9D6E;
    --success-bg: #16261C;
  }
  *{box-sizing:border-box; margin:0; padding:0; -webkit-tap-highlight-color: transparent;}
  html, body{ height:100%; }
  body{
    background:var(--bg);
    color:var(--ink);
    font-family: -apple-system, 'Helvetica Neue', Arial, sans-serif;
    padding: env(safe-area-inset-top) 16px calc(env(safe-area-inset-bottom) + 16px);
    max-width: 480px;
    margin: 0 auto;
  }
  .topbar{
    display:flex; align-items:center; justify-content:space-between;
    padding: 14px 0 10px;
  }
  .navbtn{
    width:40px; height:40px; border-radius:50%;
    background: var(--panel); border: 1px solid var(--line);
    color: var(--ink); font-size: 20px;
    display:flex; align-items:center; justify-content:center;
    -webkit-user-select:none; user-select:none;
  }
  .navbtn:active{ background: var(--panel2); }
  .navbtn.disabled{ opacity: 0.3; pointer-events:none; }
  .weekinfo{ text-align:center; }
  .weekinfo .n{ font-size:12px; color:var(--ink-dim); letter-spacing:0.03em; }
  .weekinfo .d{ font-size:16px; font-weight:600; margin-top:2px; }

  .phase-bar{
    display:flex; align-items:center; gap:8px;
    background: var(--panel); border-radius: 10px;
    padding: 10px 14px; margin: 4px 0 16px;
  }
  .dot{ width:8px; height:8px; border-radius:50%; flex-shrink:0; }
  .phase-name{ font-size:14px; font-weight:600; }
  .phase-count{ margin-left:auto; font-size:12px; color:var(--ink-mute); }

  .session{
    background: var(--panel); border: 1px solid var(--line);
    border-radius: 14px; padding: 16px 16px 6px; margin-bottom: 14px;
  }
  .session-head{
    display:flex; align-items:center; justify-content:space-between;
    margin-bottom: 8px;
  }
  .session-name{ font-size:15px; font-weight:600; }
  .badge{
    font-size:11px; padding:2px 9px; border-radius:100px;
    background: var(--panel2); color: var(--ink-mute);
  }
  .badge.done{ background: var(--success-bg); color: var(--success); }

  .ex-row{
    display:flex; align-items:flex-start; gap:12px;
    padding: 10px 2px; width:100%;
  }
  .ex-row:active .check{ transform: scale(0.9); }
  .check{
    width:24px; height:24px; border-radius:50%; flex-shrink:0; margin-top:1px;
    border: 2px solid var(--line);
    display:flex; align-items:center; justify-content:center;
    transition: transform 0.1s;
  }
  .check.on{ background: var(--success); border-color: var(--success); }
  .check svg{ width:14px; height:14px; }
  .ex-name{ font-size:14.5px; color: var(--ink); line-height:1.35; }
  .ex-name.done{ color: var(--ink-mute); text-decoration: line-through; }
  .ex-sr{ font-size:12.5px; color: var(--ink-dim); margin-top:2px; }

  .race-card{
    display:flex; flex-direction:column; align-items:center; gap:10px;
    padding: 48px 20px; text-align:center;
  }
  .race-card .t{ font-size:17px; font-weight:600; }
  .race-card .s{ font-size:14px; color:var(--ink-dim); max-width:280px; }

  .save-warn{
    font-size:12px; color: #C9603F; text-align:center; margin-top:10px;
  }
  .footer-space{ height: 20px; }

  .ex-name{ text-decoration: underline; text-decoration-color: var(--line); text-underline-offset: 3px; }

  .modal-overlay{
    position: fixed; inset: 0; background: rgba(0,0,0,0.55);
    display:flex; align-items:flex-end; justify-content:center;
    z-index: 100; padding: 0;
  }
  .modal-sheet{
    background: var(--panel); border-radius: 20px 20px 0 0;
    width: 100%; max-width: 480px; max-height: 82vh; overflow-y: auto;
    padding: 20px 20px calc(env(safe-area-inset-bottom) + 24px);
    animation: slideup 0.18s ease-out;
  }
  @keyframes slideup{ from{ transform: translateY(20px); opacity:0.6; } to{ transform: translateY(0); opacity:1; } }
  .modal-close{
    width:32px; height:32px; border-radius:50%;
    background: var(--panel2); border:none; color: var(--ink-dim);
    font-size:18px; display:flex; align-items:center; justify-content:center;
    float:right; margin-left:12px;
  }
  .modal-title{ font-size:18px; font-weight:700; margin-bottom:14px; padding-right:40px; }
  .modal-section{ margin-bottom:14px; }
  .modal-label{ font-size:11px; text-transform:uppercase; letter-spacing:0.04em; color: var(--ink-mute); margin-bottom:4px; }
  .modal-text{ font-size:14.5px; line-height:1.5; color: var(--ink); }
  .modal-text.warn{ color: #E0A458; }
  .modal-yt{
    display:flex; align-items:center; gap:10px;
    background: var(--panel2); border-radius:10px; padding:12px 14px;
    margin-top:6px; text-decoration:none; color: var(--ink);
  }
  .modal-yt .ico{ width:28px; height:20px; background:#E0424B; border-radius:5px; flex-shrink:0; display:flex; align-items:center; justify-content:center; }
  .modal-yt .ico svg{ width:12px; height:12px; }
  .modal-yt .txt{ font-size:13.5px; }
  .modal-yt .txt .sub{ font-size:11.5px; color: var(--ink-mute); margin-top:1px; }

  .modal-frames{
    display:flex; gap:10px; margin-bottom:16px;
  }
  .frame{
    flex:1; background: var(--panel2); border-radius: 12px;
    padding: 8px 8px 4px; text-align:center;
  }
  .frame svg{ width:100%; height:auto; display:block; }
  .frame .flbl{
    font-size:11px; color: var(--ink-mute); padding: 4px 0 4px;
    text-transform: uppercase; letter-spacing: 0.04em;
  }
  .frame-arrow{
    display:flex; align-items:center; color: var(--ink-mute); font-size:18px;
  }

  .set-ctrl{
    display:flex; align-items:center; gap:8px; flex-shrink:0;
  }
  .pills{ display:flex; gap:4px; align-items:center; }
  .pill{
    width:7px; height:14px; border-radius:4px;
    background: var(--line); display:inline-block;
  }
  .pill.on{ background: var(--success); }
  .set-add{
    width:38px; height:38px; border-radius:50%;
    background: var(--panel2); border: 1.5px solid var(--line);
    color: var(--ink); font-size:20px; font-weight:600;
    display:flex; align-items:center; justify-content:center;
    cursor:pointer;
  }
  .set-add:active{ transform: scale(0.92); }
  .set-add.full{ background: var(--success); border-color: var(--success); }
  .set-undo{
    width:28px; height:28px; border-radius:50%;
    background:none; border:none; color: var(--ink-mute);
    font-size:18px; display:flex; align-items:center; justify-content:center;
    cursor:pointer;
  }
</style>
</head>
<body>

<noscript><div style="padding:20px;color:#ECEFE9;font-size:15px">Esta app necesita JavaScript. Ábrela en Safari o Chrome.</div></noscript>
<script>
window.onerror = function(msg, src, line){
  var d = document.createElement('div');
  d.style.cssText = 'padding:16px;background:#3A1F1F;color:#F0C0C0;font-size:13px;border-radius:10px;margin:10px 0;';
  d.textContent = 'Error: ' + msg + ' (línea ' + line + ')';
  document.body.insertBefore(d, document.body.firstChild);
};
</script>

path d=\"M70 92 L76 118 L76 140\" stroke=\"#8FBCAB\" stroke-width=\"4\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/></svg>"]]}, "fondos_silla": {"titulo": "Fondos en silla", "desc": "Manos en el borde de una silla firme por detrás del cuerpo, piernas extendidas al frente con talones en el suelo. Baja el cuerpo doblando los codos hacia atrás y empuja hasta extender los brazos.", "clave": "Los codos apuntan hacia atrás, no hacia los lados, y el cuerpo baja pegado a la silla.", "evitar": "Bajar más allá de donde el hombro se sienta cómodo — si hay pinzamiento o molestia en el hombro, reduce el rango o dobla las rodillas para aliviar carga.", "yt": "chair dips triceps tutorial", "frames": [["Abajo", "<svg viewBox=\"0 0 140 160\" xmlns=\"http://www.w3.org/2000/svg\" fill=\"none\"><line x1=\"8\" y1=\"142\" x2=\"132\" y2=\"142\" stroke=\"#4A5A52\" stroke-width=\"2\"/><rect x=\"18\" y=\"96\" width=\"34\" height=\"6\" rx=\"2\" fill=\"#4A5A52\"/><line x1=\"24\" y1=\"102\" x2=\"24\" y2=\"142\" stroke=\"#4A5A52\" stroke-width=\"3\"/><line x1=\"46\" y1=\"102\" x2=\"46\" y2=\"142\" stroke=\"#4A5A52\" stroke-width=\"3\"/><circle cx=\"56\" cy=\"60\" r=\"8\" stroke=\"#8FBCAB\" stroke-width=\"3\"/><path d=\"M56 68 L58 108\" stroke=\"#8FBCAB\" stroke-width=\"4\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/><path d=\"M56 74 L44 84 L40 96\" stroke=\"#8FBCAB\" stroke-width=\"4\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/><path d=\"M58 108 L84 116 L104 140\" stroke=\"#8FBCAB\" stroke-width=\"4\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/></svg>"], ["Arriba", "<svg viewBox=\"0 0 140 160\" xmlns=\"http://www.w3.org/2000/svg\" fill=\"none\"><line x1=\"8\" y1=\"142\" x2=\"132\" y2=\"142\" stroke=\"#4A5A52\" stroke-width=\"2\"/><rect x=\"18\" y=\"96\" width=\"34\" height=\"6\" rx=\"2\" fill=\"#4A5A52\"/><line x1=\"24\" y1=\"102\" x2=\"24\" y2=\"142\" stroke=\"#4A5A52\" stroke-width=\"3\"/><line x1=\"46\" y1=\"102\" x2=\"46\" y2=\"142\" stroke=\"#4A5A52\" stroke const STORAGE_KEY = "rutina-fuerza-valencia-checks";
let checks = {};
try {
  const raw = localStorage.getItem(STORAGE_KEY);
  checks = raw ? JSON.parse(raw) : {};
} catch(e) { checks = {}; }

function persist(){
  try { localStorage.setItem(STORAGE_KEY, JSON.stringify(checks)); }
  catch(e) { document.getElementById('saveWarn').style.display = 'block'; }
}

function exKey(semana, si, ei){ return 's'+semana+'-ses'+si+'-ex'+ei; }

function totalSets(sr){
  // "4 x 5" -> 4 | "2-3 x 25-30" -> 3 | "3 x 20 segundos" -> 3
  const m = String(sr).match(/^(\d+)(?:\s*-\s*(\d+))?\s*x/i);
  if (!m) return 1;
  return m[2] ? parseInt(m[2]) : parseInt(m[1]);
}

function getCount(key){
  const v = checks[key];
  if (v === true) return 99;   // migración: check antiguo = ejercicio completo
  if (typeof v === 'number') return v;
  return 0;
}

function formatFecha(iso){
  const d = new Date(iso+'T00:00:00');
  const meses = ['ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic'];
  return d.getDate()+' '+meses[d.getMonth()];
}

function findCurrentWeek(){
  const hoy = new Date(); hoy.setHours(0,0,0,0);
  let idx = 0;
  for (let i=0;i<SEMANAS.length;i++){
    const inicio = new Date(SEMANAS[i].fecha_inicio+'T00:00:00');
    const fin = new Date(inicio); fin.setDate(fin.getDate()+7);
    if (hoy >= inicio && hoy < fin){ idx = i; break; }
    if (hoy >= inicio) idx = i;
  }
  return idx;
}

function openFicha(nombreEjercicio){
  const key = FICHA_MAP[nombreEjercicio];
  const ficha = FICHAS[key];
  if (!ficha) return;

  const ytQuery = encodeURIComponent(ficha.yt);
  const ytUrl = 'https://www.youtube.com/results?search_query=' + ytQuery;

  let framesHtml = '';
  if (ficha.frames && ficha.frames.length){
    framesHtml = '<div class="modal-frames">';
    ficha.frames.forEach((fr, i) => {
      if (i > 0) framesHtml += '<div class="frame-arrow">›</div>';
      framesHtml += '<div class="frame">' + fr[1] + '<div class="flbl">' + fr[0] + '</div></div>';
    });
    framesHtml += '</div>';
  }

  const root = document.getElementById('modalRoot');
  root.innerHTML = '<div class="modal-overlay" id="modalOverlay">'
    + '<div class="modal-sheet">'
      + '<button class="modal-close" id="modalCloseBtn">✕</button>'
      + '<div class="modal-title">'+ficha.titulo+'</div>'
      + framesHtml
      + '<div class="modal-section">'
        + '<div class="modal-label">Cómo se hace</div>'
        + '<div class="modal-text">'+ficha.desc+'</div>'
      + '</div>'
      + '<div class="modal-section">'
        + '<div class="modal-label">Punto clave</div>'
        + '<div class="modal-text">'+ficha.clave+'</div>'
      + '</div>'
      + '<div class="modal-section">'
        + '<div class="modal-label">Evita esto</div>'
        + '<div class="modal-text warn">'+ficha.evitar+'</div>'
      + '</div>'
      + '<a class="modal-yt" href="'+ytUrl+'" target="_blank" rel="noopener">'
        + '<span class="ico"><svg viewBox="0 0 24 24" fill="white"><path d="M8 5v14l11-7z"/></svg></span>'
        + '<span class="txt">Buscar video en YouTube<div class="sub">'+ficha.yt+'</div></span>'
      + '</a>'
    + '</div>'
  + '</div>';

  document.getElementById('modalOverlay').addEventListener('click', (e) => {
    if (e.target.id === 'modalOverlay') closeFicha();
  });
  document.getElementById('modalCloseBtn').addEventListener('click', closeFicha);
}

function closeFicha(){
  document.getElementById('modalRoot').innerHTML = '';
}

let semanaIdx = findCurrentWeek();

function render(){
  const semana = SEMANAS[semanaIdx];
  const isCarrera = semana.sesiones.length === 0;
  const color = FASE_COLOR[semana.fase] || '#9AA69D';

  document.getElementById('weekN').textContent = 'Semana '+semana.semana+' de 20';
  document.getElementById('weekD').textContent = formatFecha(semana.fecha_inicio);
  document.getElementById('phaseDot').style.background = color;
  document.getElementById('phaseName').textContent = semana.fase;

  document.getElementById('prevBtn').className = 'navbtn' + (semanaIdx===0 ? ' disabled':'');
  document.getElementById('nextBtn').className = 'navbtn' + (semanaIdx===SEMANAS.length-1 ? ' disabled':'');

  const totalEx = semana.sesiones.reduce((a,s)=>a+s.ejercicios.length,0);
  const totalDone = semana.sesiones.reduce((a,s,si)=>a+s.ejercicios.filter((ex,ei)=>getCount(exKey(semana.semana,si,ei)) >= totalSets(ex.sr)).length,0);
  document.getElementById('phaseCount').textContent = isCarrera ? '' : totalDone+'/'+totalEx+' hechos';

  const container = document.getElementById('sessions');
  container.innerHTML = '';

  if (isCarrera){
    const div = document.createElement('div');
    div.className = 'session';
    div.innerHTML = '<div class="race-card">'
      + '<div style="font-size:32px">🏁</div>'
      + '<div class="t">Semana del Maratón de Valencia</div>'
      + '<div class="s">Sin sesiones de fuerza esta semana. Descansa y confía en el trabajo hecho.</div>'
      + '</div>';
    container.appendChild(div);
    return;
  }

  semana.sesiones.forEach((sesion, si) => {
    const done = sesion.ejercicios.filter((ex,ei)=>getCount(exKey(semana.semana,si,ei)) >= totalSets(ex.sr)).length;
    const complete = done === sesion.ejercicios.length;

    const card = document.createElement('div');
    card.className = 'session';

    const head = document.createElement('div');
    head.className = 'session-head';
    head.innerHTML = '<span class="session-name">'+sesion.nombre+'</span>'
      + '<span class="badge'+(complete?' done':'')+'">'+done+'/'+sesion.ejercicios.length+'</span>';
    card.appendChild(head);

    sesion.ejercicios.forEach((ex, ei) => {
      const key = exKey(semana.semana, si, ei);
      const sets = totalSets(ex.sr);
      const count = Math.min(getCount(key), sets);
      const isDone = count >= sets;

      const row = document.createElement('div');
      row.className = 'ex-row';

      // Zona de texto: abre la ficha
      const textBtn = document.createElement('button');
      textBtn.style.cssText = 'background:none;border:none;padding:0;text-align:left;flex:1;cursor:pointer;';
      textBtn.innerHTML = '<span class="ex-name'+(isDone?' done':'')+'">'+ex.n+'</span>'
        + '<span class="ex-sr">'+ex.sr+'</span>';
      textBtn.addEventListener('click', () => openFicha(ex.n));

      // Control de series: pills + botón de suma
      const ctrl = document.createElement('div');
      ctrl.className = 'set-ctrl';

      let pillsHtml = '<span class="pills">';
      for (let p = 0; p < sets; p++) {
        pillsHtml += '<span class="pill'+(p < count ? ' on':'')+'"></span>';
      }
      pillsHtml += '</span>';

      const addBtn = document.createElement('button');
      addBtn.className = 'set-add'+(isDone?' full':'');
      addBtn.innerHTML = isDone
        ? '<svg viewBox="0 0 24 24" fill="none" stroke="#0F1512" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" width="15" height="15"><polyline points="20 6 9 17 4 12"></polyline></svg>'
        : '+';
      addBtn.addEventListener('click', () => {
        if (!isDone) {
          checks[key] = count + 1;
          persist();
          render();
        }
      });

      const undoBtn = document.createElement('button');
      undoBtn.className = 'set-undo';
      undoBtn.textContent = '−';
      undoBtn.style.visibility = count > 0 ? 'visible' : 'hidden';
      undoBtn.addEventListener('click', () => {
        checks[key] = Math.max(0, count - 1);
        persist();
        render();
      });

      ctrl.innerHTML = pillsHtml;
      ctrl.appendChild(undoBtn);
      ctrl.appendChild(addBtn);

      row.appendChild(textBtn);
      row.appendChild(ctrl);

      card.appendChild(row);
    });

    container.appendChild(card);
  });
}

document.getElementById('prevBtn').addEventListener('click', () => {
  if (semanaIdx > 0){ semanaIdx--; render(); }
});
document.getElementById('nextBtn').addEventListener('click', () => {
  if (semanaIdx < SEMANAS.length-1){ semanaIdx++; render(); }
});

render();
</script>

<div class="save-warn" id="saveWarn" style="display:none;">No se pudo guardar el progreso en este navegador.</div>
